.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">Đẩy đơn về cửa hàng,</text><text x="1112.5" y="303.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">in phiếu soạn hàng</text><rect x="1226.5" y="553.0" width="162" height="76" rx="8" ry="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/><text x="1307.5" y="579.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">Soạn hàng, cân trọng</text><text x="1307.5" y="595.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">lượng thực tế, kiểm</text><text x="1307.5" y="611.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">hạn dùng</text><rect x="1421.5" y="553.0" width="162" height="76" rx="8" ry="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/><text x="1502.5" y="579.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">Đóng gói giữ lạnh,</text><text x="1502.5" y="595.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">dán tem &amp; kiểm nhiệt</text><text x="1502.5" y="611.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">độ thùng</text><rect x="1616.5" y="403.0" width="162" height="76" rx="8" ry="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/><text x="1697.5" y="429.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">Điều phối &amp; gán</text><text x="1697.5" y="445.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">shipper theo tuyến</text><text x="1697.5" y="461.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">giao</text><rect x="1811.5" y="703.0" width="162" height="76" rx="8" ry="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.6"/><text x="1892.5" y="737.0" text-anchor="middle" font-family="DejaVu Sans" font-size="12" fill="#1B2A41">Nhận hàng, giao khách</text><text x="1892.5" y="753.0"